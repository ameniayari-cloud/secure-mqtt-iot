services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto_config:/mosquitto/config
      - ./certs:/mosquitto/certs:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: iot_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: AdminPassword123!
      DOCKER_INFLUXDB_INIT_ORG: iot_org
      DOCKER_INFLUXDB_INIT_BUCKET: temperature_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token-123456
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: iot_bridge
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: mosquitto
      MQTT_PORT: 8883
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: my-super-secret-auth-token-123456
      INFLUX_ORG: iot_org
      INFLUX_BUCKET: temperature_data
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mosquitto
      - influxdb

  sensor:
    build: ./sensor
    container_name: iot_sensor
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: mosquitto
      MQTT_PORT: 8883
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mosquitto

volumes:
  influxdb_data:
  influxdb_config:
